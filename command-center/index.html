<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baruch-Ermi AI Command Center</title><style>body{font:16px system-ui;background:#f4f6fa;color:#17263a;margin:0}main{max-width:850px;margin:auto;padding:32px 20px}section{background:white;border:1px solid #dbe2ea;border-radius:16px;padding:24px;margin:20px 0}textarea{box-sizing:border-box;width:100%;min-height:140px;padding:12px;font:inherit}button{background:#164e63;color:white;border:0;border-radius:8px;padding:12px 20px;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#536477}</style><main><small>BARUCH-ERMI / PRIVATE WORKSPACE</small><h1>AI Command Center</h1><p>GPT + Claude collaboration pilot</p><section><h2>System status</h2><p id="status">Checking database…</p></section><section><h2>New task</h2><p>Use synthetic data only during testing.</p><form id="form"><textarea id="task" required maxlength="2000" placeholder="Describe the task"></textarea><p><button id="run">Run collaboration</button></p></form></section><section><h2>Results</h2><pre id="result">No task submitted.</pre></section></main><script>const status=document.querySelector('#status'),result=document.querySelector('#result'),button=document.querySelector('#run');async function refresh(){try{const r=await fetch('/api/status');const j=await r.json();status.textContent=j.database+' | '+(j.live?'Live':'Offline demonstration')+' | Reserved $'+(j.reserved??0).toFixed(2)+' of $4.50';}catch{status.textContent='Status unavailable';}}refresh();document.querySelector('#form').onsubmit=async e=>{e.preventDefault();button.disabled=true;result.textContent='Running…';try{const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task:document.querySelector('#task').value})});result.textContent=JSON.stringify(await r.json(),null,2);}catch{result.textContent='Request failed';}finally{button.disabled=false;refresh();}};</script></html>
