<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Command Center V2.1</title><style>body{font:16px system-ui;background:#edf2f6;color:#17283b;margin:0}main{max-width:1000px;margin:auto;padding:24px}section{background:white;border:1px solid #dce4eb;border-radius:14px;padding:22px;margin:18px 0}textarea,select,input{box-sizing:border-box;width:100%;padding:10px;margin:8px 0;border:1px solid #aab9c6;border-radius:6px;font:inherit}button{background:#12566a;color:white;border:0;border-radius:7px;padding:12px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block}h1{font-size:32px}small{color:#526578}</style><main><small>BARUCH-ERMI / PRIVATE WORKSPACE</small><h1>AI Command Center V2.1</h1><p>Manual collaboration · no AI API calls · synthetic data only</p><p id="status" role="status">Loading…</p><section><h2>Project workspace</h2><select id="project" aria-label="Project"></select><h3>Persistent instructions</h3><textarea id="instructions" rows="5" aria-label="Instructions"></textarea><button id="save">Save instructions</button><h3>Shared memory</h3><pre id="memory"></pre></section><section><h2>Session history and verification</h2><select id="session" aria-label="Session"></select><pre id="history"></pre><div id="criteria"></div><button id="score">Save evidence score</button><pre id="result"></pre></section><section><h2>Consolidated cross-review</h2><textarea id="task" placeholder="Shared task" aria-label="Task"></textarea><div id="responses"></div><button id="review">Prepare review</button><textarea id="prompt" rows="10" aria-label="Review prompt" readonly></textarea><button id="copy">Copy review</button></section></main><script type="module">
const $=id=>document.getElementById(id);let data;
const rubric={independentEvidence:30,functionalTests:25,modelConsistency:20,sourceQuality:15,riskDisclosure:10};
for(const [k,v] of Object.entries(rubric)){const l=document.createElement('label');l.textContent=k+' ('+v+' points) — verified evidence reference';const i=document.createElement('input');i.id=k;l.append(i);$('criteria').append(l)}
for(const name of ['ChatGPT','Claude','Gemini']){const l=document.createElement('label');l.textContent=name;const t=document.createElement('textarea');t.id=name;t.rows=5;l.append(t);$('responses').append(l)}
async function api(body){const r=await fetch('/api/v21',body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
function show(){const p=$('project').value;$('instructions').value=data.projects.find(x=>x.slug===p)?.instructions||'';$('memory').textContent=data.memory.filter(x=>x.project_slug===p).map(x=>x.note).join('\n');$('session').replaceChildren(...data.sessions.filter(x=>x.project_slug===p).map(x=>new Option(x.created_at+' — '+x.id,x.id)));history()}
function history(){const id=$('session').value;$('history').textContent=JSON.stringify({original:data.sessions.find(x=>x.id===id)?.verification,scores:data.scores.filter(x=>x.session_id===id)},null,2)}
async function load(){data=await api();const old=$('project').value;$('project').replaceChildren(...data.projects.map(x=>new Option(x.name,x.slug)));if(data.projects.some(x=>x.slug===old))$('project').value=old;show();$('status').textContent='Neon connected'}
function action(fn){return async()=>{try{await fn()}catch(e){$('status').textContent=e.message}}}
$('project').onchange=show;$('session').onchange=history;$('save').onclick=action(async()=>{await api({action:'instructions',project:$('project').value,instructions:$('instructions').value});await load()});$('score').onclick=action(async()=>{const evidence=Object.fromEntries(Object.keys(rubric).map(k=>[k,{verified:!!$(k).value.trim(),reference:$(k).value}]));const r=await api({action:'score',session:$('session').value,evidence});$('result').textContent=JSON.stringify(r,null,2);await load()});$('review').onclick=action(async()=>{$('prompt').value=(await api({action:'review',project:$('project').value,task:$('task').value,responses:Object.fromEntries(['ChatGPT','Claude','Gemini'].map(k=>[k,$(k).value]))})).prompt});$('copy').onclick=action(()=>navigator.clipboard.writeText($('prompt').value));action(load)();
</script></html>
